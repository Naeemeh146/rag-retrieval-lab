[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-lab"
version = "0.1.0"
description = "Two-stage RAG retrieval lab: hybrid BM25+dense search, RRF fusion, cross-encoder reranking, and offline benchmarks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Naeemeh Yadollahpour" }]
keywords = ["rag", "retrieval", "bm25", "reranking", "information-retrieval", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "typer>=0.9",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0",
  "cohere>=5.0",
]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.0",
  "pytest>=8.0",
  "ruff>=0.4",
  "types-PyYAML>=6.0",
  "retrieval-lab[models]",
]

[project.scripts]
retrieval-lab = "retrieval_lab.cli:app"

[project.urls]
Homepage = "https://github.com/Naeemeh146/rag-retrieval-lab"
Repository = "https://github.com/Naeemeh146/rag-retrieval-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4", "DTZ", "RUF100"]
ignore = ["SIM108"]

[tool.ruff.format]
# line-length is inherited from the top-level `line-length` setting.

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "cohere.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: requires model downloads or API keys (deselected with -m 'not slow')",
]
