# BM25-only lexical retrieval baseline (fully offline).
name: bm25-only
chunker:
  name: recursive
  chunk_size: 200
  chunk_overlap: 50
embedding:
  provider: deterministic
  dimension: 384
bm25:
  enabled: true
  k1: 1.5
  b: 0.75
  top_k: 50
dense:
  enabled: false
  top_k: 50
fusion:
  method: rrf
  k: 60
  top_k: 50
rerank:
  enabled: false
  provider: none
  top_n: 10
